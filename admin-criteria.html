<main class="main" id="main">
<p class="crumb"><a href="admin.html">管理</a> › 期末査定の基準</p>
<form method="post" class="stack"><input type="hidden" name="csrf" value=""><section class="card">
  <h1 class="h2">判定基準</h1>
  <p class="small">難易度は<b>本人が1〜5で選び、上長が必要なときだけ修正</b>します（2段階以上変えるときは理由が必須。例外は人事が再判定）。ここでは期末査定の計算だけを設定します。</p>
</section>
<section class="card">
  <h2 class="h3">期末査定（AI査定）</h2>
  <p class="small muted">達成率から基本点を決めます（下限％以上でその点）。50%未満は1です。</p>
  <div class="row wrap">
    <label class="mini-in">基本点5の下限<input type="number" step="1" name="band_5" value="120">%</label><label class="mini-in">基本点4の下限<input type="number" step="1" name="band_4" value="100">%</label><label class="mini-in">基本点3の下限<input type="number" step="1" name="band_3" value="80">%</label><label class="mini-in">基本点2の下限<input type="number" step="1" name="band_2" value="50">%</label>  </div>
  <div class="row wrap">
    <label class="mini-in">難易度がこの値以上<input type="number" name="bonus_min_diff" value="4" min="1" max="5"></label>
    <label class="mini-in">基本点2・3に加える点<input type="number" name="bonus_value" value="1" min="0" max="2"></label>
    <label class="mini-in">難易度がこの値以下<input type="number" name="penalty_max_diff" value="2" min="1" max="5"></label>
    <label class="mini-in">基本点5に加える点<input type="number" name="penalty_value" value="-1" min="-2" max="0"></label>
  </div>
  <p class="small muted">総合評定＝各目標の査定を難易度で重み付けした平均を四捨五入（1〜5）。</p>
</section>
<div class="row"><button class="btn primary">基準を保存する</button></div>
</form>
</main>
<dialog id="confirm" class="dlg">
  <form method="dialog">
    <p class="dlg-msg"></p>
    <div class="dlg-reason" hidden>
      <label for="dlg-reason-input">差戻しの理由（本人が直すときの道しるべになります）</label>
      <textarea id="dlg-reason-input" rows="4" maxlength="160"></textarea>
      <small class="count" data-count-for="dlg-reason-input"></small>
    </div>
    <div class="dlg-actions">
      <button value="cancel" class="btn ghost">もどる</button>
      <button value="ok" class="btn primary dlg-ok">提出する</button>
    </div>
  </form>
</dialog>
