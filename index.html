<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex, nofollow">

<meta name="referrer" content="same-origin">

<title>ログイン｜考課管理</title>

<link rel="stylesheet" href="assets/app.css?v=6">

<link rel="icon" href="assets/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="assets/preview.css"><script src="assets/preview-logins.js"></script><script src="assets/preview.js" defer></script>
<script src="assets/app.js?v=6" defer></script>

</head>

<body class="bare"><div class="preview-bar" role="note"><a href="board.html">画面一覧</a><span>社内確認用の画面写し（架空のデモデータ）。入力・提出・出力は動きません。</span></div>

<main class="main" id="main">

<section class="auth card hero-top">

  <div class="auth-head"><span class="logo lg" aria-hidden="true"></span><p class="eyebrow">三河屋</p><h1>考課管理</h1><p>目標と成長を、いつでも見える場所に。</p></div>

    <form method="post" action="#preview-off" class="stack" autocomplete="off">

    <input type="hidden" name="csrf" value="">    <div class="fld"><label for="emp_no">社員番号</label>

      <input id="emp_no" name="emp_no" inputmode="text" autocomplete="username" required maxlength="20" value=""></div>

        <button class="btn primary block" type="submit">ログイン</button>

  </form><div class="demo-logins"><p class="small"><b>デモの社員番号</b>（押すと入力されます）</p><ul><li><button type="button" class="demo-id" data-demo-id="M011"><b>M011</b><span>社員</span></button><small>自分の考課表を書いて提出する</small></li><li><button type="button" class="demo-id" data-demo-id="M010"><b>M010</b><span>上長</span></button><small>部下の考課表を確認してコメントする</small></li><li><button type="button" class="demo-id" data-demo-id="A090"><b>A090</b><span>人事・管理者</span></button><small>提出状況・集計・出力・マスタ管理</small></li></ul><p class="small muted">この確認用ページは社員番号だけで入れます。本番は社員番号＋本人PINです。　<a href="board.html">画面一覧から選ぶ</a></p></div>

  <p class="muted small">PINを忘れたときは、管理者に初期化を依頼してください。</p>

</section>

</main>

<dialog id="confirm" class="dlg">

  <form method="dialog">

    <p class="dlg-msg"></p>

    <div class="dlg-reason" hidden>

      <label for="dlg-reason-input">差戻しの理由（本人が直すときの道しるべになります）</label>

      <textarea id="dlg-reason-input" rows="4" maxlength="160"></textarea>

      <small class="count" data-count-for="dlg-reason-input"></small>

    </div>

    <div class="dlg-actions">

      <button value="cancel" class="btn ghost">もどる</button>

      <button value="ok" class="btn primary dlg-ok">提出する</button>

    </div>

  </form>

</dialog>

</body>

</html>
